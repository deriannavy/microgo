name: microgo

services:

  db:
    container_name: database-microgo
    image: postgres:16.3
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: 4cc0unts
    volumes:
      - db-microgo-data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "accounts", "-d", "finance" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    container_name: redis-cache
    image: redis:6.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  redis-commander:
    container_name: redis-cache-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOST=redis-cache
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    restart:
      unless-stopped

volumes:
  db-microgo-data:

networks:
  internal:
    driver: bridge